tensor_basics:
  default_device: "cuda"  # cuda, cpu, or auto
  tensor_sizes:
    small: 100
    medium: 1000
    large: 10000
  dtype: "float32"  # float32, float16, int64, int32

benchmarks:
  warmup_iterations: 5
  test_iterations: 20
  matrix_sizes: [64, 128, 256, 512, 1024, 2048, 4096]
  element_count: 10000000  # For element-wise operations

memory_profiling:
  test_tensor_size: [256, 1024, 1024]  # ~1GB tensor
  batch_sizes: [1, 8, 16, 32, 64, 128, 256]
  image_shape:
    channels: 3
    height: 224
    width: 224
