model:
  name: Qwen/Qwen2.5-1.5B

data:
  path: data/01_cold_start_cot_sft/data.jsonl

output:
  directory: models/adapter_experiment

peft:
  method: lora
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  max_length: 1024
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10
  eval_steps: 50
  save_steps: 200
  save_total_limit: 2
  max_steps: null
  seed: 42

dtype:
  fp16: false
  bf16: true

integrations:
  report_to: none
