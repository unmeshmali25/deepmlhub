name: LLM CI

# Byte-free by design: CI never runs `dvc pull` / `dvc repro` / `dvc push`.
# Data lives in GCS and is pulled/updated by humans on their own machines.
# CI only validates pointers + code, so it stays fast and costs no egress.
on:
  push:
    paths:
      - "projects/llm-retard-lab/**/*.dvc"
      - "projects/llm-retard-lab/dvc.yaml"
      - "projects/llm-retard-lab/dvc.lock"
      - "projects/llm-retard-lab/configs/**"
      - "projects/llm-retard-lab/src/**"
      - "projects/llm-retard-lab/tests/**"
      - "projects/llm-retard-lab/pyproject.toml"
      - ".github/workflows/dvc-smoke.yaml"
  pull_request:
    paths:
      - "projects/llm-retard-lab/**/*.dvc"
      - "projects/llm-retard-lab/dvc.yaml"
      - "projects/llm-retard-lab/dvc.lock"
      - "projects/llm-retard-lab/configs/**"
      - "projects/llm-retard-lab/src/**"
      - "projects/llm-retard-lab/tests/**"
      - "projects/llm-retard-lab/pyproject.toml"
      - ".github/workflows/dvc-smoke.yaml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/llm-retard-lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install check deps (no GCS plugin, no torch)
        run: pip install "dvc==3.66.1" pytest pyyaml "ruff==0.16.8"

      - name: Validate DVC graph (offline, no data needed)
        run: |
          dvc dag
          dvc stage list

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests (offline — no data, no GCP)
        run: PYTHONPATH=src pytest tests/ -v
